[project]
name = "tool-call-boundary-research"
version = "0.1.0"
description = "Reproducible source replay and evidence auditing for LLM tool-call parsing boundaries"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["regex==2026.9.29"]

[project.optional-dependencies]
infra = [
    "Jinja2==3.1.6",
    "jsonschema==4.26.0",
    "openai==3.40.0",
    "orjson==3.13.0",
    "partial-json-parser==0.2.1.1.post7",
    "pydantic==2.14.1",
    "shortuuid==1.0.13",
]
native-build = ["cmake==4.4.4", "ninja==1.13.2"]

[tool.uv]
package = false
